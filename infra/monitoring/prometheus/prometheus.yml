global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: match-service-go
    metrics_path: /metrics
    static_configs:
      - targets: ["match-service-go:8080"]

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
