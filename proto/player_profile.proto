syntax = "proto3";

package compunube.player.v1;

option go_package = "github.com/aepatino5112/compunube-proyecto-1/gen/go/player/v1;playerv1";

// Draft v0.1. E43 must close compatibility rules before production use.
service PlayerProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc SettleRace(SettleRaceRequest) returns (SettleRaceResponse);
}

message GetProfileRequest {
  string player_id = 1;
}

message GetProfileResponse {
  string player_id = 1;
  int64 coins = 2;
  int64 plastic = 3;
  int64 metal = 4;
}

message SettleRaceRequest {
  string race_id = 1;
  string player_id = 2;
  int64 plastic_collected = 3;
  int64 metal_collected = 4;
  string request_id = 5;
}

message SettleRaceResponse {
  bool applied = 1;
}
