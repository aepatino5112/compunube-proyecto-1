[package]
name = "player-profile-service"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
async-trait = "0.1"
prost = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-health = "0.12"
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.40", features = ["test-util"] }
