name: CI Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate public OpenAPI
        run: npx --yes --package @apidevtools/swagger-cli@4.0.4 swagger-cli validate contracts/http/openapi.yaml

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install Go protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Compile protobuf contracts
        shell: bash
        run: |
          mapfile -t files < <(find proto -type f -name '*.proto' -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .proto files found"
            exit 1
          fi
          protoc \
            --proto_path=proto \
            --descriptor_set_out=/tmp/compunube-contracts.pb \
            --include_imports \
            "${files[@]}"

      - name: Generate Go and Rust gRPC stubs
        run: bash proto/codegen/generate.sh /tmp/compunube-contract-stubs

      - name: Upload generated contract stubs
        uses: actions/upload-artifact@v4
        with:
          name: contract-stubs-${{ github.sha }}
          path: /tmp/compunube-contract-stubs
          retention-days: 7
          if-no-files-found: error
