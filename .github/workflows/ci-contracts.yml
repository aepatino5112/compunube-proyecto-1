name: CI Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Compile protobuf contracts
        shell: bash
        run: |
          mapfile -t files < <(find proto -type f -name '*.proto' -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .proto files found"
            exit 1
          fi
          protoc \
            --proto_path=proto \
            --descriptor_set_out=/tmp/compunube-contracts.pb \
            --include_imports \
            "${files[@]}"
