name: CI Infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral database credentials
        run: |
          for key in POSTGRES_PASSWORD MATCH_DB_PASSWORD PLAYER_DB_PASSWORD MONITOR_DB_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Validate local quality targets
        run: make -n quality >/dev/null
      - name: Validate Compose
        run: docker compose config
      - name: Validate Envoy configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro" \
            envoyproxy/envoy:v1.31-latest \
            envoy --mode validate -c /etc/envoy/envoy.yaml
