name: CI Deploy

# H66: exercises scripts/deploy on a clean runner before any lab attempt:
# deploy revision A, deploy revision B (with a database backup), roll back to A.
# lab-roles: the lab split by machine (scripts/lab.mjs), one Compose project per
# role so the services only meet through published ports, as on separate PCs.
on:
  pull_request:
    paths:
      - "scripts/deploy/**"
      - "scripts/lab.mjs"
      - "apps/client-secondary/compunube_client/webhost.py"
      - "compose.yml"
      - ".env.example"
      - "services/*/Dockerfile"
      - ".github/workflows/ci-deploy.yml"
  push:
    branches: [main]
    paths:
      - "scripts/deploy/**"
      - "scripts/lab.mjs"
      - "apps/client-secondary/compunube_client/webhost.py"
      - "compose.yml"
      - "services/*/Dockerfile"
      - ".github/workflows/ci-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Write an untracked env file with ephemeral secrets
        run: |
          cp .env.example .env
          for key in POSTGRES_PASSWORD MATCH_DB_PASSWORD PLAYER_DB_PASSWORD MONITOR_DB_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            sed -i "s/^${key}=.*/${key}=${value}/" .env
          done
          git check-ignore -q .env
      - name: Refuses to deploy without secrets
        run: |
          cp .env .env.bad && sed -i 's/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=/' .env.bad
          if COMPUNUBE_ENV_FILE=.env.bad scripts/deploy/deploy.sh; then echo "deploy accepted an empty secret" >&2; exit 1; fi
          rm .env.bad
      - name: Deploy revision A
        run: COMPUNUBE_REVISION=ci-a scripts/deploy/deploy.sh
      - name: Deploy revision B (backs up PostgreSQL first)
        run: |
          COMPUNUBE_REVISION=ci-b scripts/deploy/deploy.sh
          ls -l .deploy/backups
          test "$(ls .deploy/backups | wc -l)" -ge 1
      - name: Roll back to revision A without rebuilding
        run: |
          scripts/deploy/rollback.sh
          cat .deploy/history
          tail -n 1 .deploy/history | grep -q " ci-a rollback-from-ci-b"
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env logs --no-color --tail 100
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans

  lab-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One folder per machine with the same .env, addressed by the runner IP
        run: |
          ip=$(hostname -I | awk '{print $1}')
          for role in db rust go web; do cp -r . "../lab-$role"; done
          (cd ../lab-db && node scripts/lab.mjs init --db "$ip" --rust "$ip" --go "$ip")
          grep PASSWORD ../lab-db/.env | cut -d= -f2 | sed 's/^/::add-mask::/'
          for role in rust go web; do cp ../lab-db/.env "../lab-$role/.env"; done
          for role in db rust go web; do echo "COMPOSE_PROJECT_NAME=lab-$role" >> "../lab-$role/.env"; done
          grep -E '^(POSTGRES_PORT|POSTGRES_ADDR|PLAYER_PROFILE_GRPC_ADDR|COMPUNUBE_GO_URL)=' ../lab-db/.env
      - name: Database machine
        working-directory: ../lab-db
        run: node scripts/lab.mjs db
      - name: Rust machine (Envoy + two replicas)
        working-directory: ../lab-rust
        run: node scripts/lab.mjs rust
      - name: Go machine
        working-directory: ../lab-go
        run: node scripts/lab.mjs go
      - name: Each machine runs only its role
        run: |
          docker ps --format '{{.Names}}' | sort
          test "$(docker compose -p lab-rust ps -q postgres)" = ""
          test "$(docker compose -p lab-go ps -q postgres envoy)" = ""
          test "$(docker compose -p lab-db ps -q match-service-go player-profile-rust-1)" = ""
          (cd ../lab-web && node scripts/lab.mjs check)
      - name: Web machine proxies a browser session to the remote Go
        working-directory: ../lab-web
        run: |
          node scripts/lab.mjs web > web.log 2>&1 &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS -c jar -X POST -H 'Origin: http://127.0.0.1:4173' http://127.0.0.1:4173/v1/sessions -o /dev/null
          curl -fsS -b jar -H 'Origin: http://127.0.0.1:4173' http://127.0.0.1:4173/v1/profile | grep -q '"equipment"'
          cat web.log
      - name: Web machine with the Python instance (same UI, no pip install)
        working-directory: ../lab-web
        run: |
          COMPUNUBE_WEB_PORT=4174 node scripts/lab.mjs web --python > pyweb.log 2>&1 &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          cmp <(curl -fsS http://127.0.0.1:4174/) apps/web/dist/index.html
          curl -fsS -c pyjar -X POST -H 'Origin: http://127.0.0.1:4174' http://127.0.0.1:4174/v1/sessions -o /dev/null
          curl -fsS -b pyjar -H 'Origin: http://127.0.0.1:4174' http://127.0.0.1:4174/v1/profile | grep -q '"equipment"'
          cat pyweb.log
      - name: Two clients race while both Rust replicas fail in turn
        working-directory: apps/client-secondary
        env:
          COMPUNUBE_SERVER: http://127.0.0.1:8080
        run: |
          python -m pip install -q -r requirements.txt
          mkdir -p ../../../pa ../../../pb
          HOME=$(cd ../../../pa && pwd) python -u -m compunube_client play --create maracaibo --race-timeout 400 > a.log 2>&1 &
          a=$!
          for _ in $(seq 1 30); do room=$(grep -o 'room_[A-Za-z0-9_-]*' a.log | head -n 1); [ -n "$room" ] && break; sleep 1; done
          HOME=$(cd ../../../pb && pwd) python -u -m compunube_client play --join "$room" --race-timeout 400 > b.log 2>&1 &
          b=$!
          for _ in $(seq 1 60); do grep -q 'Carrera iniciada' a.log && break; sleep 1; done
          (cd ../../../lab-rust && docker compose kill player-profile-rust-1 && node scripts/lab.mjs rust && docker compose kill player-profile-rust-2 && node scripts/lab.mjs rust)
          wait $a; wait $b
          cat a.log b.log
          grep -q 'Settlement de tu participación: confirmed' a.log
          grep -q 'Settlement de tu participación: confirmed' b.log
      - name: Logs on failure
        if: failure()
        run: for role in db rust go; do docker compose -p "lab-$role" logs --no-color --tail 60; done
      - name: Cleanup
        if: always()
        run: for role in db rust go; do (cd "../lab-$role" 2>/dev/null && docker compose down -v --remove-orphans) || true; done

  # The lab machines run scripts/lab.mjs from PowerShell on Windows: entry point
  # (also through a junction), .env creation and both web instances against a
  # stand-in Go. Docker roles stay on Linux (lab-roles): the runner has no
  # Linux containers.
  lab-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The command runs, also through a junction and with other letter case
        run: |
          $out = node scripts/lab.mjs | Out-String
          if ($out -notmatch 'Despliegue por roles') { throw "lab.mjs printed nothing: $out" }
          New-Item -ItemType Junction -Path C:\labjunction -Target $PWD | Out-Null
          Push-Location C:\labjunction
          $out = node SCRIPTS\Lab.mjs | Out-String
          Pop-Location
          if ($out -notmatch 'Despliegue por roles') { throw "lab.mjs via junction printed nothing: $out" }
      - name: init writes one .env and keeps its secrets
        run: |
          node scripts/lab.mjs init --db 10.0.0.16 --rust 10.0.0.14 --go 10.0.0.15
          $env1 = Get-Content .env -Raw
          if ($env1 -notmatch 'POSTGRES_ADDR=10.0.0.16:55432') { throw 'POSTGRES_ADDR missing' }
          if ($env1 -notmatch 'PLAYER_PROFILE_GRPC_ADDR=10.0.0.14:50051') { throw 'PLAYER_PROFILE_GRPC_ADDR missing' }
          if ($env1 -notmatch 'COMPUNUBE_GO_URL=http://10.0.0.15:8080') { throw 'COMPUNUBE_GO_URL missing' }
          if ($env1 -notmatch 'POSTGRES_PASSWORD=[0-9a-f]{48}') { throw 'secret missing' }
          $out = node scripts/lab.mjs init --db 10.0.0.16 --rust 10.0.0.14 --go 10.0.0.15 | Out-String
          if ($out -notmatch 'secretos conservados') { throw "secrets not kept: $out" }
          $secret = { param($t) ([regex]'POSTGRES_PASSWORD=(\w+)').Match($t).Groups[1].Value }
          if ((& $secret $env1) -ne (& $secret (Get-Content .env -Raw))) { throw 'secret changed' }
      - name: Both web instances serve the UI and forward /v1 to Go
        run: |
          Set-Content fake-go.mjs "import http from 'node:http'; http.createServer((q, r) => { r.writeHead(200, {'Content-Type': 'application/json'}); r.end(JSON.stringify({fake: true, path: q.url})) }).listen(18080, '127.0.0.1')"
          Start-Process node -ArgumentList 'fake-go.mjs' -NoNewWindow
          Start-Sleep 2
          Remove-Item .env   # a web machine has no .env; the previous step's points to made-up IPs
          node scripts/lab.mjs check --go 127.0.0.1:18080
          if ($LASTEXITCODE -ne 0) { throw 'check failed' }
          $index = Get-Content apps/web/dist/index.html -Raw
          foreach ($case in @(@{port = 4173; args = @()}, @{port = 4174; args = @('--python')})) {
            $env:COMPUNUBE_WEB_PORT = $case.port
            Start-Process node -ArgumentList (@('scripts/lab.mjs', 'web', '--go', '127.0.0.1:18080') + $case.args) -NoNewWindow
            $ok = $false
            foreach ($i in 1..30) { try { $page = Invoke-WebRequest "http://127.0.0.1:$($case.port)/" -UseBasicParsing; $ok = $true; break } catch { Start-Sleep 1 } }
            if (-not $ok) { throw "web $($case.args) did not start" }
            if ($page.Content -ne $index) { throw "web $($case.args) served another page" }
            $api = Invoke-RestMethod "http://127.0.0.1:$($case.port)/v1/profile"
            if ($api.path -ne '/v1/profile') { throw "web $($case.args) did not forward /v1" }
            Write-Host "web $($case.args) on $($case.port): UI and /v1 OK"
          }
