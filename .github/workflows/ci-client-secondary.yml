name: CI Client Secondary

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/client-secondary/**"
      - ".github/workflows/ci-client-secondary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-client-secondary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-secondary:
    name: client-secondary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/client-secondary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q compunube_client
      - name: Tk is available (graphical window)
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Install Xvfb (Linux display for the window test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Run client tests (window test required, never skipped)
        env:
          CLIENT_GUI_REQUIRED: "1"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest -q -rs
          else
            python -m pytest -q -rs
          fi
      - name: CLI help
        run: python -m compunube_client --help
