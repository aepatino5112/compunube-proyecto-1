name: CI Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "compose.yml"
      - ".env.example"
      - "services/**"
      - "infra/**"
      - "database/**"
      - "proto/**"
      - ".github/workflows/ci-integration.yml"

permissions:
  contents: read

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config

      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Verify Match Service
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:8080/readyz

      - name: Verify Envoy
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:9901/ready

      - name: Verify Prometheus
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:9090/-/ready

      - name: Verify Grafana
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:3000/api/health

      - name: Show stack
        run: docker compose ps

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
