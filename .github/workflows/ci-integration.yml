name: CI Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "compose.yml"
      - ".env.example"
      - "services/**"
      - "infra/**"
      - "database/**"
      - "proto/**"
      - "scripts/validation/j83-profile-economy.py"
      - "scripts/validation/j85-compose-readiness.py"
      - "scripts/validation/h68-prometheus.py"
      - ".github/workflows/ci-integration.yml"
  push:
    branches: [main]
    paths:
      - "compose.yml"
      - ".env.example"
      - "services/**"
      - "infra/**"
      - "database/**"
      - "proto/**"
      - "scripts/validation/j83-profile-economy.py"
      - "scripts/validation/j85-compose-readiness.py"
      - "scripts/validation/h68-prometheus.py"
      - ".github/workflows/ci-integration.yml"

permissions:
  contents: read

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          for key in POSTGRES_PASSWORD MATCH_DB_PASSWORD PLAYER_DB_PASSWORD MONITOR_DB_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done

      - name: Validate Compose
        run: docker compose config

      - name: Build service images
        run: docker compose build

      - name: Start integrated stack
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Verify PostgreSQL initialization
        run: |
          schemas=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT nspname FROM pg_namespace"')
          grep -qx match <<< "$schemas"
          grep -qx player <<< "$schemas"

      - name: Verify E42 migrations and recovery
        run: docker compose exec -T postgres sh /opt/compunube-database/scripts/smoke.sh

      - name: Verify runtime credentials and cross-schema denial (J84)
        run: docker compose run --rm --no-deps db-migrate sh /opt/compunube-database/scripts/smoke-runtime.sh

      - name: Verify Rust replicas
        run: |
          first=$(docker compose ps -q player-profile-rust-1)
          second=$(docker compose ps -q player-profile-rust-2)
          test -n "$first" && test -n "$second"
          test "$(docker inspect -f '{{.State.Health.Status}}' "$first")" = healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' "$second")" = healthy
          test "$(docker inspect -f '{{.Image}}' "$first")" = "$(docker inspect -f '{{.Image}}' "$second")"

      - name: Verify Match Service
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:8080/readyz

      - name: Verify Envoy
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:9901/ready

      - name: Verify gRPC health through Envoy
        run: |
          # db-migrate completes before Rust starts; Envoy needs its first
          # active gRPC health round before hosts enter rotation.
          for attempt in $(seq 1 30); do
            healthy=$(curl --fail --silent --show-error http://127.0.0.1:9901/clusters | grep -Ec 'player_profile_cluster::.*::health_flags::healthy' || true)
            if [ "$healthy" -eq 2 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Envoy sees $healthy healthy Rust replicas, expected 2" >&2
          exit 1

      - name: Verify Prometheus
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:9090/-/ready

      - name: Verify Grafana
        run: |
          curl --fail --silent --show-error             --retry 30 --retry-delay 2 --retry-all-errors             --connect-timeout 2 --max-time 5             http://127.0.0.1:3000/api/health

      - name: Show stack
        run: docker compose ps

      - name: Validate public profile and economy path (J83)
        run: python3 scripts/validation/j83-profile-economy.py

      - name: Validate gRPC Compose readiness and recovery (J85)
        env:
          J85_SKIP_BUILD: "1"
        run: python3 scripts/validation/j85-compose-readiness.py

      - name: Validate Prometheus targets and recovery (H68)
        env:
          H68_SKIP_BUILD: "1"
        run: python3 scripts/validation/h68-prometheus.py

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
