name: CI Go

on:
  pull_request:
    paths:
      - "services/match-service-go/**"
      - ".github/workflows/ci-go.yml"
  push:
    branches: [main]
    paths:
      - "services/match-service-go/**"
      - ".github/workflows/ci-go.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/match-service-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/match-service-go/go.mod
          cache-dependency-path: services/match-service-go/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
