name: CI Go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/match-service-go
    # Real PostgreSQL for the matchstore/settlement delivery tests. Throwaway
    # credentials for this ephemeral service container only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: compunube
          POSTGRES_PASSWORD: compunube_ci
          POSTGRES_DB: compunube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compunube -d compunube"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MATCHSTORE_TEST_DATABASE_URL: postgresql://compunube:compunube_ci@localhost:5432/compunube
      # A missing database must fail the job, never skip the DB tests.
      MATCHSTORE_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/match-service-go/go.mod
          cache-dependency-path: services/match-service-go/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Migrate PostgreSQL (bootstrap schemas and database/migrations)
        working-directory: .
        env:
          DATABASE_URL: postgresql://compunube:compunube_ci@localhost:5432/compunube
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/init/00-bootstrap.sql
          sh database/scripts/migrate.sh
      - name: Unit and PostgreSQL tests
        run: go test -v -run Postgres ./internal/matchstore/ && go test ./...
      - name: Race detector
        run: go test -race ./...
