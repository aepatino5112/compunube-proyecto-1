name: Generate Rust Lockfile

on:
  pull_request:
    paths:
      - "services/player-profile-service-rust/Cargo.toml"
      - ".github/workflows/generate-rust-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"

      - name: Generate Cargo.lock
        working-directory: services/player-profile-service-rust
        run: cargo generate-lockfile

      - name: Commit lockfile and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/player-profile-service-rust/Cargo.lock
          git rm .github/workflows/generate-rust-lock.yml
          git commit -m "chore(rust): lock application dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
